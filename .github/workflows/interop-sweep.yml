name: interop sweep

# A manually-dispatched cross-engine regression sweep: pairs every eligible
# individual corpus fixture, round by round, through this repository's own
# engine and through an independently-fetched comparison-engine binary, and
# reports where they disagree. See tests/interop/README.md for the full
# design.
#
# Deliberately workflow_dispatch only, no schedule: it downloads a
# caller-supplied binary from an arbitrary public URL and runs it, so it only
# ever runs when someone explicitly asks for it, with the URL in hand at
# dispatch time -- not unattended.
on:
  workflow_dispatch:
    inputs:
      binary_url:
        description: "Public URL to download the comparison-engine binary or .tar.gz/.tgz archive from (the JaVaFo-style pairing CLI/output convention -- '<binary> --dutch INPUT -p OUTPUT')"
        required: true
        type: string
      binary_sha256:
        description: "Expected sha256 of the download. Strongly recommended -- omitted means unverified. Leave blank if unknown."
        required: false
        type: string
      binary_path_in_archive:
        description: "Path to the binary inside the archive, if binary_url is a .tar.gz/.tgz with more than one file. Leave blank for a raw binary, or an archive containing exactly one file."
        required: false
        type: string
      run_windows:
        description: "Also run the sweep on Windows"
        required: false
        type: boolean
        default: false
      binary_url_windows:
        description: "Windows-specific binary URL, if different from binary_url (many engines publish separate Linux/Windows builds). Leave blank to reuse binary_url."
        required: false
        type: string
      binary_sha256_windows:
        description: "sha256 for binary_url_windows. Leave blank to reuse binary_sha256 (only if binary_url_windows is also blank)."
        required: false
        type: string
      binary_path_in_archive_windows:
        description: "Archive path for binary_url_windows. Leave blank to reuse binary_path_in_archive (only if binary_url_windows is also blank)."
        required: false
        type: string
      sample_size:
        description: "Fixtures to sample per shard instead of the full corpus, for a cheap smoke-test dispatch. Leave blank for the full sweep (~1.5-2h)."
        required: false
        type: string

concurrency:
  group: interop-sweep-${{ github.ref }}
  cancel-in-progress: false

# Downloads and runs a caller-supplied binary and reads the repository; it
# writes nothing back to it.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------
  # Self-validation gate (tests/interop/README.md, "Running the validation
  # gate"): this engine's own -c oracle vs. -p on the truncated file. No
  # external binary involved --
  # a truncation bug manufactures a divergence on both sides of the real
  # comparison at once, so this has to pass before a single result from the
  # jobs below is trusted. Sharded the same way the corpus test suite is.
  # ---------------------------------------------------------------------
  gate:
    name: Self-validation gate · shard ${{ matrix.shard.number }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard:
          - {number: 1, index: 0}
          - {number: 2, index: 1}
          - {number: 3, index: 2}
          - {number: 4, index: 3}
          - {number: 5, index: 4}
          - {number: 6, index: 5}
          - {number: 7, index: 6}
          - {number: 8, index: 7}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Validate the truncation transform against this engine's own oracle
        env:
          SAMPLE_SIZE: ${{ inputs.sample_size }}
        run: |
          FLAG="--full"
          if [ -n "$SAMPLE_SIZE" ]; then FLAG="--sample $SAMPLE_SIZE"; fi
          python tests/interop/validate_truncation.py --shard ${{ matrix.shard.index }} --shards 8 $FLAG

  # ---------------------------------------------------------------------
  # The sweep itself, one job per OS. Windows only runs when dispatched with
  # run_windows: true -- most dispatches only need Linux, and a Windows build
  # of the comparison engine is not always available.
  # ---------------------------------------------------------------------
  sweep_linux:
    name: Sweep (Linux) · shard ${{ matrix.shard.number }}/8
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard:
          - {number: 1, index: 0}
          - {number: 2, index: 1}
          - {number: 3, index: 2}
          - {number: 4, index: 3}
          - {number: 5, index: 4}
          - {number: 6, index: 5}
          - {number: 7, index: 6}
          - {number: 8, index: 7}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Fetch the dispatched engine binary
        env:
          URL: ${{ inputs.binary_url }}
          SHA256: ${{ inputs.binary_sha256 }}
          PATH_IN_ARCHIVE: ${{ inputs.binary_path_in_archive }}
        run: |
          bash tests/interop/fetch-engine-binary.sh \
            --url "$URL" --sha256 "$SHA256" --path-in-archive "$PATH_IN_ARCHIVE" \
            --out tests/interop/bin/engine.exe --name engine
      - name: Run this shard
        env:
          TIEBREAK_INTEROP_ENGINE_BINARY: ${{ github.workspace }}/tests/interop/bin/engine.exe
          TIEBREAK_INTEROP_ENGINE_NAME: dispatched (linux)
          TIEBREAK_INTEROP_ENGINE_VERSION: ${{ inputs.binary_sha256 || 'unverified' }}
          SAMPLE_SIZE: ${{ inputs.sample_size }}
        run: |
          FLAG="--full"
          if [ -n "$SAMPLE_SIZE" ]; then FLAG="--sample $SAMPLE_SIZE"; fi
          python tests/interop/runner.py $FLAG --shard ${{ matrix.shard.index }} --shards 8 \
            --out results.linux.shard${{ matrix.shard.index }}.jsonl
      - uses: actions/upload-artifact@v7
        with:
          name: interop-results-linux-${{ matrix.shard.number }}
          path: results.linux.shard*.jsonl
          if-no-files-found: error
          retention-days: 14

  sweep_windows:
    name: Sweep (Windows) · shard ${{ matrix.shard.number }}/8
    needs: gate
    if: ${{ inputs.run_windows }}
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard:
          - {number: 1, index: 0}
          - {number: 2, index: 1}
          - {number: 3, index: 2}
          - {number: 4, index: 3}
          - {number: 5, index: 4}
          - {number: 6, index: 5}
          - {number: 7, index: 6}
          - {number: 8, index: 7}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Resolve Windows-specific binary inputs
        # A plain bash if/else here, rather than a nested GH-expression
        # ternary in `env:`, so the fallback ("no Windows-specific override
        # was given, reuse the Linux one") stays readable.
        shell: bash
        env:
          URL_WINDOWS: ${{ inputs.binary_url_windows }}
          SHA256_WINDOWS: ${{ inputs.binary_sha256_windows }}
          PATH_IN_ARCHIVE_WINDOWS: ${{ inputs.binary_path_in_archive_windows }}
          URL_LINUX: ${{ inputs.binary_url }}
          SHA256_LINUX: ${{ inputs.binary_sha256 }}
          PATH_IN_ARCHIVE_LINUX: ${{ inputs.binary_path_in_archive }}
        run: |
          if [ -n "$URL_WINDOWS" ]; then
            echo "RESOLVED_URL=$URL_WINDOWS" >> "$GITHUB_ENV"
            echo "RESOLVED_SHA256=$SHA256_WINDOWS" >> "$GITHUB_ENV"
            echo "RESOLVED_PATH_IN_ARCHIVE=$PATH_IN_ARCHIVE_WINDOWS" >> "$GITHUB_ENV"
          else
            echo "RESOLVED_URL=$URL_LINUX" >> "$GITHUB_ENV"
            echo "RESOLVED_SHA256=$SHA256_LINUX" >> "$GITHUB_ENV"
            echo "RESOLVED_PATH_IN_ARCHIVE=$PATH_IN_ARCHIVE_LINUX" >> "$GITHUB_ENV"
          fi
          echo "RESOLVED_VERSION=${SHA256_WINDOWS:-${SHA256_LINUX:-unverified}}" >> "$GITHUB_ENV"
      - name: Fetch the dispatched engine binary
        shell: bash
        env:
          URL: ${{ env.RESOLVED_URL }}
          SHA256: ${{ env.RESOLVED_SHA256 }}
          PATH_IN_ARCHIVE: ${{ env.RESOLVED_PATH_IN_ARCHIVE }}
        run: |
          bash tests/interop/fetch-engine-binary.sh \
            --url "$URL" --sha256 "$SHA256" --path-in-archive "$PATH_IN_ARCHIVE" \
            --out tests/interop/bin/engine.exe --name engine
      - name: Run this shard
        shell: bash
        env:
          TIEBREAK_INTEROP_ENGINE_BINARY: ${{ github.workspace }}/tests/interop/bin/engine.exe
          TIEBREAK_INTEROP_ENGINE_NAME: dispatched (windows)
          TIEBREAK_INTEROP_ENGINE_VERSION: ${{ env.RESOLVED_VERSION }}
          SAMPLE_SIZE: ${{ inputs.sample_size }}
        run: |
          FLAG="--full"
          if [ -n "$SAMPLE_SIZE" ]; then FLAG="--sample $SAMPLE_SIZE"; fi
          python tests/interop/runner.py $FLAG --shard ${{ matrix.shard.index }} --shards 8 \
            --out results.windows.shard${{ matrix.shard.index }}.jsonl
      - uses: actions/upload-artifact@v7
        with:
          name: interop-results-windows-${{ matrix.shard.number }}
          path: results.windows.shard*.jsonl
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------
  # Merge every shard that ran, produce the Markdown report, and publish it
  # both as a downloadable artifact and as the run's job summary.
  # ---------------------------------------------------------------------
  report:
    name: Report
    needs: [sweep_linux, sweep_windows]
    if: ${{ !cancelled() && needs.sweep_linux.result == 'success' && (needs.sweep_windows.result == 'success' || needs.sweep_windows.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Download every shard's results
        uses: actions/download-artifact@v8
        with:
          path: shards
          pattern: interop-results-*
          merge-multiple: true
      - name: Merge and report
        # report.py's per-divergence external-engine -l checklist is best-effort
        # and degrades to "not generated" without raising when no binary is
        # present at tests/interop/bin/ (see its own docstring) -- this job
        # doesn't re-fetch one, since a Linux+Windows dispatch could have two
        # different binaries and there's no single right choice for a
        # divergence found on either. The reproducer's core content (the
        # truncated TRF and both engines' raw outcomes) is unaffected.
        run: |
          python tests/interop/runner.py --merge shards/*.jsonl --out tests/interop/results.jsonl
          python tests/interop/report.py
          cat tests/interop/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: interop-report
          path: |
            tests/interop/REPORT.md
            tests/interop/results.jsonl
            tests/interop/repro/
          if-no-files-found: error
          retention-days: 30
